
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'github_dark'

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

[palettes.github_dark]
fg = '#E6EDF3'
muted = '#8B949E'
blue = '#79C0FF'
green = '#7EE787'
yellow = '#E3B341'
red = '#FF7B72'
purple = '#D2A8FF'

[os]
disabled = false
style = 'fg:muted'
format = '[$symbol ]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = 'fg:fg'
style_root = 'bold fg:red'
format = '[$user]($style)'

[hostname]
ssh_only = false
style = 'fg:fg'
format = '[@$hostname ]($style)'

[directory]
style = 'bold fg:blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ' '
style = 'fg:green'
format = '[$symbol$branch ]($style)'

[git_status]
style = 'fg:yellow'
format = '([\[$all_status$ahead_behind\] ]($style))'

[character]
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:purple)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:purple)'
